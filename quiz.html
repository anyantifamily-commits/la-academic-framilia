<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LA Academic Framilia CBT</title>

    <link rel="stylesheet" href="quiz.css">
</head>

<body>

    <main class="quiz-page">

        <!-- Header -->
        <header class="quiz-header">

            <div>
                <p class="group-name">
                    LA ACADEMIC FRAMILIA
                </p>

                <h1 id="quizTitle">
                    BIO 101 — Cell Biology
                </h1>
            </div>

            <div class="timer-box">
                <span>TIME LEFT</span>
                <strong id="timer">60:00</strong>
            </div>

        </header>


        <!-- Progress -->
        <section class="progress-area">

            <div class="progress-info">

                <span id="questionCounter">
                    Question 1 of 10
                </span>

                <span id="progressPercent">
                    10%
                </span>

            </div>

            <div class="progress-bar">
                <div id="progressFill"></div>
            </div>

        </section>


        <!-- Question -->
        <section class="question-card">

            <div class="question-number" id="questionNumber">
                QUESTION 01
            </div>

            <h2 id="questionText">
                Question goes here.
            </h2>

            <div id="optionsContainer">
                <!-- Options generated by JavaScript -->
            </div>

        </section>


        <!-- Navigation -->
        <section class="navigation">

            <button id="previousBtn" class="secondary-btn">
                ← Previous
            </button>

            <button id="nextBtn" class="primary-btn">
                Next →
            </button>

        </section>


        <!-- Question Navigator -->
        <section class="navigator-card">

            <div class="navigator-heading">

                <div>
                    <h3>Questions</h3>
                    <p>Tap a number to jump to a question.</p>
                </div>

                <span id="answeredCount">
                    0 answered
                </span>

            </div>

            <div id="questionNavigator">
                <!-- Question numbers generated here -->
            </div>

        </section>


        <!-- Submit -->
        <button id="submitBtn" class="submit-btn">
            SUBMIT CBT
        </button>


        <!-- Results -->
        <section id="resultSection" class="result-section">

            <div class="result-card">

                <p class="result-label">
                    CBT COMPLETED
                </p>

                <h2 id="resultScore">
                    0 / 0
                </h2>

                <p id="resultPercentage">
                    0%
                </p>

                <p id="resultMessage">
                    Your result will appear here.
                </p>

                <button
                    id="reviewBtn"
                    class="primary-btn"
                >
                    REVIEW ANSWERS
                </button>

                <button
                    id="homeBtn"
                    class="secondary-btn"
                >
                    BACK TO HOME
                </button>

            </div>

            <div id="reviewContainer">
                <!-- Corrections generated here -->
            </div>

        </section>

    </main>


    <script src="quiz.js"></script>

</body>
</html>
